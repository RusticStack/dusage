[package]
name = "dusage"
version = "0.3.0"
edition = "2021"
description = "Fast parallel disk-usage scanner and age-filtered pruner for Windows"
license = "MIT OR Apache-2.0"
authors = ["RusticStack"]
repository = "https://github.com/RusticStack/dusage"
readme = "README.md"
keywords = ["disk-usage", "ntfs", "windows", "cli", "cleanup"]
categories = ["command-line-utilities", "filesystem"]
rust-version = "1.89"
exclude = ["assets/", ".github/", "docs/", "EXAMPLE.md", "AGENTS.md"]

[[bin]]
name = "dusage"
path = "src/bin/dusage.rs"

[[bin]]
name = "fastdel"
path = "src/bin/fastdel.rs"

[profile.release]
opt-level = 3
lto = true
