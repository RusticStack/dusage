name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Build release
        run: cargo build --release
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: dusage-windows
          path: |
            target/release/dusage.exe
            target/release/fastdel.exe
          if-no-files-found: error

  # Intel macOS. The label is the Intel-specific image, so this leg runs on x86_64, which is
  # also the target the crate is cross-checked against from Linux. The label is
  # x86_64-specific and time-limited: GitHub is retiring its x86_64 macOS runners, and MRI-14
  # tracks the schedule. The arm64 leg below is the answer that outlives it.
  macos:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Build release
        run: cargo build --release

  # Apple-silicon macOS. Not redundant with the leg above: `src/mac/sys.rs` gates every
  # `$INODE64` alias to `not(target_arch = "aarch64")`, so on arm64 the *plain* Darwin
  # symbols are the ones that get bound — a different set of calls, exercised only here.
  #
  # `macos-15` rather than an older arm64 image because it is the same OS generation as the
  # Intel leg, so a difference between the two is attributable to the architecture. The
  # arm64 labels GitHub still offers are `macos-latest`, `macos-15`, `macos-26` and
  # `xcode-27`; `macos-14` is no longer one of them, and a job asking for it is cancelled
  # with no runner assigned.
  macos-arm64:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Build release
        run: cargo build --release

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Install ripgrep for the differential suite
        run: sudo apt-get update -qq && sudo apt-get install -y ripgrep
      - name: Test
        run: cargo test
      - name: Differential suite against grep, ripgrep and find
        run: bash scripts/differential.sh
      - name: Build release
        run: cargo build --release
      - name: Performance guard (advisory)
        continue-on-error: true
        run: |
          set -eu
          # A tree big enough that matching dominates process startup, built from the
          # repository itself so the case is deterministic on any runner.
          rm -rf /tmp/guard && mkdir -p /tmp/guard
          for i in $(seq 1 30); do
            cat src/*.rs src/cmd/*.rs src/mac/*.rs src/unix/*.rs src/win/*.rs > "/tmp/guard/f$i.rs"
          done
          DUSAGE_BENCH_SEARCH_ROOT=/tmp/guard DUSAGE_PERF_TOL=60 \
            DUSAGE_SKIP_BUILD=1 bash scripts/perf-guard.sh
      - name: Smoke test against the filesystem oracle
        run: |
          set -eu
          bin=./target/release/dusage
          $bin -V
          ./target/release/fastdel -V
          $bin /usr --json --top 5 | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["total"]["files"] > 1000, d["total"]; print("files", d["total"]["files"], "bytes", d["total"]["bytes"])'
          want=$(find /usr -type f -printf '%s\n' | awk '{s+=$1} END {print s}')
          got=$($bin /usr --json | python3 -c 'import json,sys; print(json.load(sys.stdin)["total"]["bytes"])')
          test "$want" = "$got" || { echo "total mismatch: find=$want dusage=$got"; exit 1; }
          echo "totals match find: $got bytes"
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: dusage-linux
          path: |
            target/release/dusage
            target/release/fastdel
          if-no-files-found: error
