name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Build release
        run: cargo build --release
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: dusage-windows
          path: |
            target/release/dusage.exe
            target/release/fastdel.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Build release
        run: cargo build --release
      - name: Smoke test against the filesystem oracle
        run: |
          set -eu
          bin=./target/release/dusage
          $bin -V
          ./target/release/fastdel -V
          $bin /usr --json --top 5 | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["total"]["files"] > 1000, d["total"]; print("files", d["total"]["files"], "bytes", d["total"]["bytes"])'
          want=$(find /usr -type f -printf '%s\n' | awk '{s+=$1} END {print s}')
          got=$($bin /usr --json | python3 -c 'import json,sys; print(json.load(sys.stdin)["total"]["bytes"])')
          test "$want" = "$got" || { echo "total mismatch: find=$want dusage=$got"; exit 1; }
          echo "totals match find: $got bytes"
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: dusage-linux
          path: |
            target/release/dusage
            target/release/fastdel
          if-no-files-found: error
